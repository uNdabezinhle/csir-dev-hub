{% extends "base.html" %}{% block body %}
<div class="login"><div class="card">
<h1>CSIR <span style="color:var(--teal)">Software Development Hub</span></h1>
<p class="muted">On-prem developer workspaces: VS Code, desktops and specialist OS images.</p>
{% if oidc %}<a class="btn teal" style="display:block;text-align:center;padding:10px" href="/auth/oidc/login">Sign in with CSIR SSO (LDAP + MFA)</a>
<p class="muted" style="text-align:center">or use a local account</p>{% endif %}
<form method="post" action="/login"><label>Username</label><input name="username" style="width:100%" required>
<label>Password</label><input name="password" type="password" style="width:100%" required>
<p><button class="btn" type="submit">Sign in (local)</button></p></form>
</div><p class="muted" style="text-align:center;font-size:12px">PoC - Project lead: Ndabezinhle Hlongwane</p></div>
{% endblock %}
