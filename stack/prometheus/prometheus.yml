global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {platform: csir-devhub}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: coder
    static_configs: [{targets: ['coder:2112']}]
  - job_name: node
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: cadvisor
    static_configs: [{targets: ['cadvisor:8080']}]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{targets: ['keycloak:9000']}]
  - job_name: portal
    metrics_path: /metrics
    static_configs: [{targets: ['portal:8088']}]
